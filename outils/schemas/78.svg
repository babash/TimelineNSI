<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" lang="fr">
  <title>Des affectations stables entre trois élèves et trois formations</title>
  <desc>Vœux des élèves : Ana : Info, puis Maths, puis Bio ; Bilal : Info, Bio, Maths ; Chloé : Maths, Info, Bio. Classements des formations, une place chacune : Info : Bilal, Ana, Chloé ; Maths : Ana, Chloé, Bilal ; Bio : Ana, Bilal, Chloé. Résultat stable : Ana en Maths, Bilal en Info, Chloé en Bio. Chaque élève demande ses vœux dans l’ordre ; chaque formation garde la meilleure demande reçue.</desc>
  <!-- Schéma original : Babash - NSI Tani Malandi, CC BY-SA 4.0. Carte 78 (Gale et Shapley, 1962).
       Résultat vérifié par l’algorithme (les élèves demandent, une place par formation) : aucune paire bloquante.
       Export PNG : node outils/schemas/exporter.js 78 -->
  <style>
    @font-face { font-family: 'Lato'; font-weight: 400; src: url('../../assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 700; src: url('../../assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
    text { font-family: 'Lato', sans-serif; fill: #1a1a1a; }
    .titre { font-size: 33px; font-weight: 700; fill: #00507a; }
    .entete { font-size: 24px; fill: #404040; }
    .nom { font-size: 28px; font-weight: 700; }
    .liste { font-size: 26px; }
    .sup { fill: #707070; }
    .obtenu { font-weight: 700; text-decoration: underline; }
    .pied { font-size: 24px; fill: #303030; }
  </style>
  <rect width="1200" height="320" fill="#fff"/>
  <text class="titre" x="600" y="36" text-anchor="middle">Des paires stables : personne n’a intérêt à changer</text>
  <text class="entete" x="20" y="76">Élèves et leurs vœux</text>
  <text class="entete" x="770" y="76">Formations (1 place) et leurs classements</text>
  <rect x="20" y="89" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="80" y="121" text-anchor="middle">Ana</text>
  <text class="liste" x="156" y="121">Info<tspan class="sup"> &gt; </tspan><tspan class="obtenu">Maths</tspan><tspan class="sup"> &gt; </tspan>Bio</text>
  <rect x="20" y="151" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="80" y="183" text-anchor="middle">Bilal</text>
  <text class="liste" x="156" y="183"><tspan class="obtenu">Info</tspan><tspan class="sup"> &gt; </tspan>Bio<tspan class="sup"> &gt; </tspan>Maths</text>
  <rect x="20" y="213" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="80" y="245" text-anchor="middle">Chloé</text>
  <text class="liste" x="156" y="245">Maths<tspan class="sup"> &gt; </tspan>Info<tspan class="sup"> &gt; </tspan><tspan class="obtenu">Bio</tspan></text>
  <rect x="770" y="89" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="830" y="121" text-anchor="middle">Info</text>
  <text class="liste" x="906" y="121"><tspan class="obtenu">Bilal</tspan><tspan class="sup"> &gt; </tspan>Ana<tspan class="sup"> &gt; </tspan>Chloé</text>
  <rect x="770" y="151" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="830" y="183" text-anchor="middle">Maths</text>
  <text class="liste" x="906" y="183"><tspan class="obtenu">Ana</tspan><tspan class="sup"> &gt; </tspan>Chloé<tspan class="sup"> &gt; </tspan>Bilal</text>
  <rect x="770" y="213" width="120" height="46" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="nom" x="830" y="245" text-anchor="middle">Bio</text>
  <text class="liste" x="906" y="245">Ana<tspan class="sup"> &gt; </tspan>Bilal<tspan class="sup"> &gt; </tspan><tspan class="obtenu">Chloé</tspan></text>
  <line x1="452" y1="112" x2="758" y2="174" stroke="#00507a" stroke-width="6" stroke-linecap="round"/>
  <line x1="452" y1="174" x2="758" y2="112" stroke="#00507a" stroke-width="6" stroke-linecap="round"/>
  <line x1="452" y1="236" x2="758" y2="236" stroke="#00507a" stroke-width="6" stroke-linecap="round"/>
  <text class="pied" x="600" y="306" text-anchor="middle">Chaque élève demande ses vœux dans l’ordre ; chaque formation garde la meilleure demande reçue.</text>
</svg>
