<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" lang="fr">
  <title>L’attention d’un Transformer : à quel mot renvoie « il » ?</title>
  <desc>Deux phrases : « Le chat boit son lait car il a soif » et « Le chat boit son lait car il est froid ». Des arcs partent de « il » vers d’autres mots ; plus l’arc est épais, plus le mot compte pour comprendre « il ». Dans la première phrase, l’arc le plus épais va vers « chat » ; dans la seconde, vers « lait ». Exemple simplifié.</desc>
  <!-- Schéma original : Babash - NSI Tani Malandi, CC BY-SA 4.0. Carte 82 (Vaswani et al., 2017).
       Épaisseurs illustratives (pas des poids mesurés sur un vrai modèle) : c’est dit sur le schéma.
       Export PNG : node outils/schemas/exporter.js 82 -->
  <style>
    @font-face { font-family: 'Lato'; font-weight: 400; src: url('../../assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 700; src: url('../../assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
    text { font-family: 'Lato', sans-serif; fill: #1a1a1a; }
    .titre { font-size: 33px; font-weight: 700; fill: #5b2c6f; }
    .mot { font-size: 31px; }
    .fort { font-weight: 700; }
    .note { font-size: 26px; fill: #1a1a1a; }
    .pied { font-size: 26px; fill: #303030; }
  </style>
  <rect width="1200" height="400" fill="#fff"/>
  <text class="titre" x="600" y="36" text-anchor="middle">L’attention : pour comprendre « il », quels mots regarder ?</text>
  <text class="mot" x="334" y="168" text-anchor="middle">Le</text>
  <rect x="384" y="137" width="88" height="44" rx="6" fill="#f1e9f5" stroke="#5b2c6f" stroke-width="4"/>
  <text class="mot fort" x="428" y="168" text-anchor="middle">chat</text>
  <text class="mot" x="538" y="168" text-anchor="middle">boit</text>
  <text class="mot" x="639" y="168" text-anchor="middle">son</text>
  <text class="mot" x="741" y="168" text-anchor="middle">lait</text>
  <text class="mot" x="843" y="168" text-anchor="middle">car</text>
  <rect x="900" y="137" width="55" height="44" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="mot fort" x="928" y="168" text-anchor="middle">il</text>
  <text class="mot" x="1000" y="168" text-anchor="middle">a</text>
  <text class="mot" x="1090" y="168" text-anchor="middle">soif</text>
  <path d="M928 132 C928 63 741 63 741 132" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/>
  <path d="M928 132 C928 68 1090 68 1090 132" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/>
  <path d="M928 132 C928 39 428 39 428 132" fill="none" stroke="#5b2c6f" stroke-width="13" stroke-linecap="round"/>
  <text class="note" x="20" y="168">« il » = <tspan class="fort">le chat</tspan></text>
  <text class="mot" x="313" y="262" text-anchor="middle">Le</text>
  <text class="mot" x="406" y="262" text-anchor="middle">chat</text>
  <text class="mot" x="516" y="262" text-anchor="middle">boit</text>
  <text class="mot" x="618" y="262" text-anchor="middle">son</text>
  <rect x="676" y="231" width="88" height="44" rx="6" fill="#f1e9f5" stroke="#5b2c6f" stroke-width="4"/>
  <text class="mot fort" x="720" y="262" text-anchor="middle">lait</text>
  <text class="mot" x="822" y="262" text-anchor="middle">car</text>
  <rect x="880" y="231" width="55" height="44" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="mot fort" x="907" y="262" text-anchor="middle">il</text>
  <text class="mot" x="992" y="262" text-anchor="middle">est</text>
  <text class="mot" x="1102" y="262" text-anchor="middle">froid</text>
  <path d="M907 280 C907 373 406 373 406 280" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/>
  <path d="M907 280 C907 351 1102 351 1102 280" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/>
  <path d="M907 280 C907 349 720 349 720 280" fill="none" stroke="#5b2c6f" stroke-width="13" stroke-linecap="round"/>
  <text class="note" x="20" y="262">« il » = <tspan class="fort">le lait</tspan></text>
  <text class="pied" x="600" y="388" text-anchor="middle">Plus l’arc est épais, plus le mot compte (exemple simplifié).</text>
</svg>
